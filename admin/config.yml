
backend:
  name: github
  repo: maseyt2025-coder/mas-sas-web
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

locale: es

collections:
  - name: "paginas"
    label: "Páginas"
    files:
      - name: "inicio"
        label: "Página de inicio"
        file: "contenido/inicio.json"
        format: "json"
        fields:
          - label: "Título principal"
            name: "titulo"
            widget: "string"
          - label: "Descripción"
            name: "descripcion"
            widget: "text"
          - label: "Imagen principal"
            name: "imagen"
            widget: "image"
            required: false


  - name: "servicios"
    label: "Nuestros servicios"
    files:
      - name: "servicios"
        label: "Editar servicios"
        file: "contenido/servicios.json"
        format: "json"
        fields:
          - label: "Lista de servicios"
            name: "servicios"
            widget: "list"
            summary: "{{fields.nombre}}"
            fields:
              - label: "Nombre del servicio"
                name: "nombre"
                widget: "string"
              - label: "Descripción"
                name: "descripcion"
                widget: "text"
  - name: "empresa"
    label: "Información Empresarial"
    files: 
      - name: "datos_empresa"
        label: "datos de la empresa"
        file: "contenido/empresa.json"
        format: "json"
        fields:
          - label: "Nombre de la empresa"
            name: "nombre"
            widget: "string"

          - label: "Teléfono"
            name: "telefono"
            widget: "string"
            
          - label: "WhatsApp"
            name: "whatsapp"
            widget: "string"

          - label: "Correo electrónico"
            name: "correo"
            widget: "string"

          - label: "Dirección"
            name: "direccion"
            widget: "string"

          - label: "NIT"
            name: "nit"
            widget: "string"

          - label: "Texto del pie de página"
            name: "pie_pagina"
            widget: "text"
         
